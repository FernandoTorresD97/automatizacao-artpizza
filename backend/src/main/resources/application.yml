spring:
  application:
    name: art-pizza-backend
  # Defina SPRING_PROFILES_ACTIVE=dev ou prod explicitamente no ambiente.

admin:
  username: ${ADMIN_USERNAME:}
  password: ${ADMIN_PASSWORD:}

whatsapp:
  verify-token: ${WHATSAPP_VERIFY_TOKEN:}
  app-secret: ${WHATSAPP_APP_SECRET:}
  access-token: ${WHATSAPP_ACCESS_TOKEN:}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
  enviar-mensagens-reais: ${WHATSAPP_ENVIAR_MENSAGENS_REAIS:false}

pix:
  chave: ${PIX_CHAVE:}
  nome-recebedor: ${PIX_NOME_RECEBEDOR:ART PIZZA}
  cidade: ${PIX_CIDADE:CRUZ DAS ALMAS}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:artpizza;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:admin}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/artpizza}
    username: ${DB_USER:artpizza}
    password: ${DB_PASSWORD:artpizza}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

admin:
  username: ${ADMIN_USERNAME:}
  password: ${ADMIN_PASSWORD:}

pagamento:
  webhook:
    enabled: ${PAGAMENTO_WEBHOOK_ENABLED:false}
    secret: ${PAGAMENTO_WEBHOOK_SECRET:}
