services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: artpizza
      POSTGRES_USER: artpizza
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artpizza -d artpizza"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/artpizza
      DB_USER: artpizza
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Defina ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD}
      WHATSAPP_ENVIAR_MENSAGENS_REAIS: 'false'
      PAGAMENTO_WEBHOOK_ENABLED: 'false'
    depends_on:
      postgres:
        condition: service_healthy
  painel:
    build: ./painel
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - backend
volumes:
  postgres-data:
